[package]
name = "aurea-compositor"
version = "0.1.0"
edition = "2024"
description = "Native Wayland compositor for AureaOS"
license = "GPL-3.0-or-later"

[features]
default = []
# Opt-in only: enable the Vulkan 1.0–1.2 frame recorder after Fedora validation.
legacy-vulkan-frame = ["drm"]
heif = ["aurea-media/heif"]

# Native Linux desktop backend.
#
# DRM/KMS manages physical displays.
# GBM provides graphics buffer allocation.
# Vulkan is the exclusive rendering API.
# libinput, Udev and libseat provide input, device discovery
# and session/device access.
drm = [
    "smithay/backend_drm",
    "smithay/backend_gbm",
    "smithay/backend_libinput",
    "dep:input",
    "dep:udev",
    "input/libinput_1_21",
    "smithay/backend_udev",
    "smithay/backend_session_libseat",
    "dep:libc",
    "vulkan",
]

# Native Vulkan rendering support.
vulkan = ["smithay/backend_vulkan"]

[dependencies]
aurea-desktop-api = { path = "../aurea-desktop-api" }
aurea-media = { path = "../aurea-media" }
tracing = "0.1"
sha2 = "0.11"
toml = "0.8"
serde = { version = "1", features = ["derive"] }
input = { version = "=0.9.1", default-features = false, optional = true, features = ["libinput_1_21"] }
udev = { version = "0.9", optional = true }
libc = { version = "0.2", optional = true }

[dependencies.smithay]
version = "=0.7.0"
default-features = false
features = ["wayland_frontend", "desktop"]
