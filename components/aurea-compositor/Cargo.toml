[package]
name = "aurea-compositor"
version = "0.1.0"
edition = "2024"
description = "Native Wayland compositor for AureaOS"
license = "GPL-3.0-or-later"

[features]
default = []

# Native Linux desktop backend.
#
# DRM/KMS manages physical displays.
# GBM provides graphics buffer allocation.
# Vulkan is the exclusive rendering API.
# libinput, Udev and libseat provide input, device discovery
# and session/device access.
drm = [
    "smithay/backend_drm",
    "smithay/backend_gbm",
    "smithay/backend_libinput",
    "smithay/backend_udev",
    "smithay/backend_session_libseat",
    "vulkan",
]

# Native Vulkan rendering support.
vulkan = ["smithay/backend_vulkan"]

[dependencies]
aurea-desktop-api = { path = "../aurea-desktop-api" }

[dependencies.smithay]
version = "0.7"
default-features = false
features = ["wayland_frontend"]
