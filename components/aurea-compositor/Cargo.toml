[package]
name = "aurea-compositor"
version = "0.1.0"
edition = "2024"
description = "Wayland compositor for AureaOS"
license = "GPL-3.0-or-later"

[features]
default = []

# Native Linux desktop backend: DRM/KMS, GBM, libinput, udev and libseat.
# Multi-GPU support is provided by Smithay's renderer_multi module.
drm = [
    "smithay/backend_drm",
    "smithay/backend_gbm",
    "smithay/backend_libinput",
    "smithay/backend_udev",
    "smithay/backend_session_libseat",
    "smithay/renderer_multi",
]

# Vulkan remains an independent, opt-in rendering feature.
vulkan = ["smithay/backend_vulkan"]

[dependencies.smithay]
version = "0.7"
default-features = false
features = ["wayland_frontend"]
