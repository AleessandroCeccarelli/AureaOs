[package]
name = "aurea-desktop"
version = "0.1.0"
edition = "2024"
description = "Desktop entry point and composition root for AureaOS"
license = "GPL-3.0-or-later"

[features]
default = []
# Enable decoder-only HEIC/AVIF support in the production desktop image.
heif = ["aurea-compositor/heif"]

[dependencies]
aurea-desktop-api = { path = "../aurea-desktop-api" }
aurea-shell = { path = "../aurea-shell" }
aurea-compositor = { path = "../aurea-compositor", features = ["drm", "vulkan"] }
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client"] }
memmap2 = "0.9"
libc = "0.2"
