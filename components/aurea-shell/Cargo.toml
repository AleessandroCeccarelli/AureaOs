[package]
name = "aurea-shell"
version = "0.1.0"
edition = "2024"
description = "Desktop shell for AureaOS"
license = "GPL-3.0-or-later"

[dependencies]
ctrlc = "3"

# Native Wayland compositor with DRM/KMS and Vulkan support.
aurea-compositor = { path = "../aurea-compositor", features = ["drm", "vulkan"] }
