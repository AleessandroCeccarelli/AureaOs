name: Idea or suggestion
description: Propose an improvement or share constructive feedback.
title: "[Idea]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Suggestions are welcome, including from people who do not write code. Please distinguish a user need from a proposed implementation.
  - type: textarea
    id: problem
    attributes:
      label: What problem or need does this address?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Your suggestion
      description: Describe the idea without assuming that a particular implementation is required.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or trade-offs
  - type: textarea
    id: context
    attributes:
      label: Additional context
