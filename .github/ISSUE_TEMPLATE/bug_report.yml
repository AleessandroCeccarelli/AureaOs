name: Bug report
description: Report a reproducible problem in AureaOS.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping improve AureaOS. Please remember that the project is an early prototype.
  - type: input
    id: component
    attributes:
      label: Component
      description: Which component or subsystem is affected?
      placeholder: aurea-compositor, bootstrap, documentation...
    validations:
      required: true
  - type: input
    id: revision
    attributes:
      label: Commit or revision
      description: The commit SHA or branch you tested.
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include commands and a minimal sequence where possible.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Distribution, kernel, hardware/GPU, driver, session type, and relevant versions.
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Remove credentials, personal data, and other sensitive information before posting.
