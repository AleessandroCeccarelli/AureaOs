name: One-time Rust workspace formatting

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/format-rust-once.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Install stable Rust formatter
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format the complete Rust workspace
        run: cargo fmt --all
      - name: Commit formatting and remove this temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u -- '*.rs'
          if ! git diff --cached --quiet; then
            git commit -m "style: format Rust workspace"
          fi
          git rm .github/workflows/format-rust-once.yml
          git commit -m "ci: remove one-time Rust formatter"
          git push origin HEAD:main
