# SPDX-License-Identifier: GPL-3.0-or-later
#
# AureaOS Rust continuous integration.
# Validates formatting, workspace compilation and DRM/Vulkan compositor tests.

name: Rust CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: Rust formatting
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Rust formatter
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

  security-audit:
    name: Rust dependency security audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Rust dependency security auditor
        run: cargo install cargo-audit --locked

      - name: Audit locked Rust dependencies
        run: cargo audit --locked

  build-and-test:
    name: Build and test workspace
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install native Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            libdrm-dev \
            libgbm-dev \
            libinput-dev \
            libseat-dev \
            libudev-dev \
            libvulkan-dev \
            libwayland-dev \
            libxkbcommon-dev \
            glslang-tools \
            mesa-vulkan-drivers \
            vulkan-tools \
            pkg-config

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Check workspace
        run: cargo check --workspace --locked

      - name: Check compositor with DRM and Vulkan
        run: cargo check -p aurea-compositor --features drm --locked

      - name: Test workspace
        run: cargo test --workspace --locked

      - name: Test compositor with DRM and Vulkan
        run: cargo test -p aurea-compositor --features drm --locked

      - name: Compile Vulkan diagnostic shaders
        run: bash tools/shaders/compile-vulkan-shaders.sh

      - name: Run offscreen Vulkan triangle smoke test with Mesa lavapipe
        shell: bash
        run: |
          set -euo pipefail

          ICD_PATH="$(find /usr/share/vulkan/icd.d -maxdepth 1 -type f \
            \( -iname '*lvp*.json' -o -iname '*lavapipe*.json' \) \
            -print -quit)"

          if [[ -z "${ICD_PATH}" ]]; then
            echo "Mesa lavapipe Vulkan ICD was not installed."
            find /usr/share/vulkan -maxdepth 3 -type f -print || true
            exit 1
          fi

          echo "Using Vulkan ICD: ${ICD_PATH}"
          cat "${ICD_PATH}"
          export VK_ICD_FILENAMES="${ICD_PATH}"
          export VK_DRIVER_FILES="${ICD_PATH}"

          echo "Installed Vulkan loader and drivers:"
          ldconfig -p | grep -E 'libvulkan|libVkLayer' || true

          echo "Vulkan device discovery:"
          vulkaninfo --summary

          cargo test -p aurea-compositor --features drm --test unit \
            renders_triangle_and_reads_back_expected_pixels -- --ignored --nocapture
