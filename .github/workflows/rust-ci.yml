# SPDX-License-Identifier: GPL-3.0-or-later
#
# AureaOS Rust continuous integration.
# Validates formatting, workspace compilation and DRM/Vulkan compositor tests.

name: Rust CI

on:
  # Validate every change integrated into the main development line.
  push:
    branches: [main]
    paths-ignore:
      - '*.md'
      - '**/*.md'
  pull_request:
    branches: [main]
    paths-ignore:
      - '*.md'
      - '**/*.md'
  # Keep an explicit manual entry point for targeted reruns.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: Rust formatting
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Rust formatter
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

  security-audit:
    name: Rust dependency security audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Rust dependency security auditor
        run: cargo install cargo-audit --locked

      - name: Audit locked Rust dependencies
        run: cargo audit

  debian-media-dependencies:
    name: Debian 13 media dependency compatibility
    runs-on: ubuntu-24.04
    container:
      image: debian:trixie
    timeout-minutes: 20

    steps:
      - name: Install Rust and decoder-only HEIF and AVIF development packages
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install --yes --no-install-recommends \
            ca-certificates \
            cargo \
            libheif-dev \
            libheif-plugin-libde265 \
            libheif-plugin-dav1d \
            pkg-config \
            rustc

      - name: Verify the required libheif API baseline
        run: |
          set -eu
          rustc --version
          cargo --version
          pkg-config --modversion libheif
          pkg-config --atleast-version=1.20 libheif
          dpkg-query -W -f='${Package} ${Version}\n' \
            libheif-dev libheif1 libheif-plugin-libde265 libheif-plugin-dav1d
          for package in libheif-plugin-libde265 libheif-plugin-dav1d; do
            dpkg-query -L "${package}" | grep -F '.so' >/dev/null
          done

      - name: Compile and link the libheif-rs security API probe
        run: |
          set -eu
          mkdir -p /tmp/aurea-heif-probe/src
          cat > /tmp/aurea-heif-probe/Cargo.toml <<'EOF'
          [package]
          name = "aurea-heif-api-probe"
          version = "0.1.0"
          edition = "2021"

          [dependencies]
          libheif-rs = { version = "=3.0.0", default-features = false, features = ["v1_20"] }
          EOF
          cat > /tmp/aurea-heif-probe/src/main.rs <<'EOF'
          use libheif_rs::{HeifContext, SecurityLimits};

          fn main() {
              let mut limits = SecurityLimits::new();
              limits.set_max_image_size_pixels(64 * 1024 * 1024);
              limits.set_max_total_memory(256 * 1024 * 1024);

              let mut context = HeifContext::new().expect("create HEIF context");
              context
                  .set_security_limits(&limits)
                  .expect("apply HEIF security limits");
              let _contains_sequence = context.has_sequence();
              let _image_ids = context.image_ids();
          }
          EOF
          cargo build --manifest-path /tmp/aurea-heif-probe/Cargo.toml --locked || \
            cargo build --manifest-path /tmp/aurea-heif-probe/Cargo.toml

  build-and-test:
    name: Build and test workspace
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install native Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            libdrm-dev \
            libgbm-dev \
            libinput-dev \
            libseat-dev \
            libturbojpeg0-dev \
            libudev-dev \
            libvulkan-dev \
            libwayland-dev \
            libxkbcommon-dev \
            glslang-tools \
            librsvg2-bin \
            x11-apps \
            mesa-vulkan-drivers \
            vulkan-tools \
            pkg-config \
            shellcheck

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Validate bootstrap script
        run: |
          shellcheck tools/run-aurea-native-test.sh tools/collect-previous-boot.sh
          bash -n tools/run-aurea-native-test.sh
          bash -n tools/collect-previous-boot.sh
          bash -n tools/build/bootstrap-debian.sh
          bash -n tools/security/audit-rootfs-permissions.sh
          bash -n tools/security/tests/test-audit-rootfs-permissions.sh
          bash -n tools/installer/check-hardware-requirements.sh
          bash -n tools/installer/tests/check-hardware-requirements.sh
          python3 -m py_compile tools/build/create_staging_parent.py tools/build/publish_rootfs.py tools/security/audit-rootfs-symlinks.py tools/assets/cursor_manifest.py tools/assets/cursor_svg.py tools/assets/cursor_rasterizer.py tools/assets/xcursor_config.py tools/assets/validate_cursors.py tools/assets/build_cursor_theme.py
          python3 tools/assets/validate_cursors.py
          python3 -m unittest discover -s tools/assets/tests -p 'test_*.py' -v
          python3 tools/assets/build_cursor_theme.py
          sudo python3 -m unittest discover -s tools/build/tests -p 'test_*.py' -v
          sudo bash tools/security/tests/test-audit-rootfs-permissions.sh
          sudo python3 tools/security/tests/test-audit-rootfs-symlinks.py
          bash tools/installer/tests/check-hardware-requirements.sh

      - name: Resolve and compile first Wayland client
        run: cargo check -p aurea-desktop

      - name: Check workspace
        run: cargo check --workspace --locked

      - name: Check compositor with DRM and Vulkan
        run: cargo check -p aurea-compositor --features drm --locked

      - name: Test workspace
        run: cargo test --workspace --locked

      - name: Test compositor with DRM and Vulkan
        run: cargo test -p aurea-compositor --features drm --locked

      - name: Preserve resolved lockfile for review
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: aureaos-cargo-lock
          path: Cargo.lock
          if-no-files-found: error
          retention-days: 3

      - name: Preserve generated AureaOS Xcursor theme
        uses: actions/upload-artifact@v7
        with:
          name: aureaos-xcursor-theme
          path: aurea-human-interfaces/cursors/generated/AureaOS/
          if-no-files-found: error
          retention-days: 7

      - name: Compile Vulkan diagnostic shaders
        run: bash tools/shaders/compile-vulkan-shaders.sh

      - name: Run offscreen Vulkan triangle smoke test with Mesa lavapipe
        shell: bash
        run: |
          set -euo pipefail

          ICD_PATH="$(find /usr/share/vulkan/icd.d -maxdepth 1 -type f \
            \( -iname '*lvp*.json' -o -iname '*lavapipe*.json' \) \
            -print -quit)"

          if [[ -z "${ICD_PATH}" ]]; then
            echo "Mesa lavapipe Vulkan ICD was not installed."
            find /usr/share/vulkan -maxdepth 3 -type f -print || true
            exit 1
          fi

          echo "Using Vulkan ICD: ${ICD_PATH}"
          cat "${ICD_PATH}"
          export VK_ICD_FILENAMES="${ICD_PATH}"
          export VK_DRIVER_FILES="${ICD_PATH}"

          echo "Installed Vulkan loader and drivers:"
          ldconfig -p | grep -E 'libvulkan|libVkLayer' || true

          echo "Vulkan device discovery:"
          vulkaninfo --summary

          cargo test -p aurea-compositor --features drm --test unit \
            renders_triangle_and_reads_back_expected_pixels -- --ignored --nocapture

