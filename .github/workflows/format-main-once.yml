# Temporary maintenance workflow: apply rustfmt to the current main tree.
# This workflow is intended to be removed after the one-time formatting commit.
name: One-time Rust formatting

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/format-main-once.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Install stable Rust formatter
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Apply workspace formatting
        run: cargo fmt --all

      - name: Commit formatting changes
        run: |
          if git diff --quiet; then
            echo "The workspace is already formatted."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.rs'
          git commit -m "style: apply rustfmt across the workspace [skip ci]"
          git push origin main
