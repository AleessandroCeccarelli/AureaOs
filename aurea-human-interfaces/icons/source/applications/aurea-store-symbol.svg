<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
<title id="title">Aurea Store symbol</title>
<desc id="desc">A glossy dimensional blue shopping bag with a luminous cyan handle and a subtle Aurea A mark, on transparency.</desc>
<defs>
 <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#E9FFFF"/><stop offset=".22" stop-color="#7DE7FF"/><stop offset=".58" stop-color="#168FE0"/><stop offset="1" stop-color="#064A9E"/></linearGradient>
 <linearGradient id="face" x1=".12" y1="0" x2=".88" y2="1"><stop stop-color="#BDF5FF"/><stop offset=".2" stop-color="#42C9F2"/><stop offset=".52" stop-color="#1688D8"/><stop offset=".82" stop-color="#0755B2"/><stop offset="1" stop-color="#063B82"/></linearGradient>
 <linearGradient id="handle" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F2FFFF"/><stop offset=".24" stop-color="#8CF0FF"/><stop offset=".62" stop-color="#20A9EA"/><stop offset="1" stop-color="#0754AD"/></linearGradient>
 <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FFFFFF"/><stop offset=".55" stop-color="#D9F9FF"/><stop offset="1" stop-color="#8BE9FF"/></linearGradient>
 <linearGradient id="gloss" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FFFFFF" stop-opacity=".92"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/></linearGradient>
 <filter id="shadow" x="-35%" y="-35%" width="170%" height="185%">
