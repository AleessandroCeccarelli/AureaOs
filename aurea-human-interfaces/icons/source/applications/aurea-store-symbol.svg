 <path d="M512 506 L423 706 H468 L512 607 L556 706 H601Z" fill="url(#mark)" opacity=".96"/>
 <path d="M477 650 H547" fill="none" stroke="#0A67B9" stroke-opacity=".58" stroke-width="15" stroke-linecap="round"/>
 <path d="M466 704 L512 602 L558 704" fill="none" stroke="#FFFFFF" stroke-opacity=".7" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
