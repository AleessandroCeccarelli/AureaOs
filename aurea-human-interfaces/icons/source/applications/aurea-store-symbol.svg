 <path d="M390 368 V286 C390 210 438 166 512 166 C586 166 634 210 634 286 V368" fill="none" stroke="url(#handle)" stroke-width="48" stroke-linecap="round"/>
 <path d="M411 276 C414 214 453 184 498 180" fill="none" stroke="#FFFFFF" stroke-opacity=".82" stroke-width="12" stroke-linecap="round"/>
 <path d="M270 366 Q270 330 308 330 H716 Q754 330 754 368 L720 820 Q716 866 670 866 H354 Q308 866 304 820Z" fill="url(#edge)"/>
 <path d="M292 374 Q292 354 316 354 H708 Q732 354 732 378 L700 808 Q697 842 666 842 H358 Q327 842 324 808Z" fill="url(#face)"/>
