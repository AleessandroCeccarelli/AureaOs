  <feColorMatrix in="offset" type="matrix" values="0 0 0 0 .01 0 0 0 0 .16 0 0 0 0 .36 0 0 0 .30 0" result="shade"/>
  <feMerge><feMergeNode in="shade"/><feMergeNode in="SourceGraphic"/></feMerge>
 </filter>
 <clipPath id="bagClip"><path d="M270 366 Q270 330 308 330 H716 Q754 330 754 368 L720 820 Q716 866 670 866 H354 Q308 866 304 820Z"/></clipPath>
</defs>
<g filter="url(#shadow)">
