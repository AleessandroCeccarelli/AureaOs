<!-- Aurea AI Orb: original scalable vector artwork; transparent background. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">Aurea AI Orb</title>
  <desc id="desc">A luminous blue glass sphere containing a radiant core, orbital energy paths and network nodes. Transparent background.</desc>
  <defs>
    <radialGradient id="glass" cx="35%" cy="27%" r="76%">
      <stop offset="0" stop-color="#5cecff" stop-opacity=".42"/>
      <stop offset=".24" stop-color="#087cae" stop-opacity=".58"/>
      <stop offset=".62" stop-color="#032d52" stop-opacity=".94"/>
      <stop offset=".88" stop-color="#075b86" stop-opacity=".96"/>
      <stop offset="1" stop-color="#72efff" stop-opacity=".9"/>
    </radialGradient>
    <radialGradient id="inner" cx="48%" cy="44%" r="65%">
      <stop offset="0" stop-color="#061c37" stop-opacity=".12"/>
      <stop offset=".68" stop-color="#031a35" stop-opacity=".76"/>
      <stop offset="1" stop-color="#051f3b" stop-opacity=".12"/>
    </radialGradient>
    <radialGradient id="core" cx="35%" cy="28%" r="78%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".18" stop-color="#c9ffff"/>
      <stop offset=".48" stop-color="#42eaff"/>
      <stop offset=".78" stop-color="#087fbd"/>
      <stop offset="1" stop-color="#063b72"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e4ffff" stop-opacity=".96"/>
      <stop offset=".22" stop-color="#5beaff" stop-opacity=".36"/>
      <stop offset=".56" stop-color="#a4f8ff" stop-opacity=".12"/>
      <stop offset=".82" stop-color="#42cfff" stop-opacity=".5"/>
      <stop offset="1" stop-color="#eaffff" stop-opacity=".9"/>
    </linearGradient>
    <linearGradient id="energy" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#28dfff" stop-opacity=".08"/>
      <stop offset=".42" stop-color="#58f5ff"/>
      <stop offset=".58" stop-color="#e4ffff"/>
      <stop offset=".72" stop-color="#00bfff"/>
      <stop offset="1" stop-color="#38eaff" stop-opacity=".12"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".92"/>
      <stop offset=".38" stop-color="#c7fbff" stop-opacity=".28"/>
      <stop offset="1" stop-color="#8aefff" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <clipPath id="orbClip"><circle cx="512" cy="512" r="440"/></clipPath>
  </defs>

  <!-- The canvas is intentionally transparent. -->
  <circle cx="512" cy="512" r="440" fill="url(#glass)"/>
  <circle cx="512" cy="512" r="440" fill="none" stroke="url(#rim)" stroke-width="13"/>
  <circle cx="512" cy="512" r="423" fill="none" stroke="#b9faff" stroke-opacity=".28" stroke-width="3"/>

  <g clip-path="url(#orbClip)">
    <circle cx="512" cy="512" r="405" fill="url(#inner)"/>
    <ellipse cx="365" cy="285" rx="245" ry="160" fill="#a8f6ff" opacity=".12" transform="rotate(-28 365 285)"/>
    <path d="M185 310 C250 120 495 100 675 190 C810 258 884 394 850 530" fill="none" stroke="#d7ffff" stroke-opacity=".28" stroke-width="18" filter="url(#softGlow)"/>
    <path d="M170 300 C235 145 430 105 590 145" fill="none" stroke="#e8ffff" stroke-opacity=".64" stroke-width="5"/>
    <path d="M150 620 C260 780 490 850 700 765 C835 710 900 590 885 470" fill="none" stroke="#5deaff" stroke-opacity=".34" stroke-width="4"/>

    <!-- Fine orbital paths -->
    <g fill="none" stroke="#51eaff" stroke-width="2.2" opacity=".78">
      <path d="M95 520 C250 300 420 340 512 512 S780 720 930 470"/>
      <path d="M105 610 C285 790 405 660 512 512 S760 265 930 385"/>
      <path d="M130 430 C300 560 405 760 610 690 S820 500 900 350"/>
      <path d="M135 690 C310 500 410 300 600 330 S820 510 910 600"/>
      <path d="M220 180 C300 350 420 430 512 512 S680 670 800 850"/>
      <path d="M800 170 C710 330 610 420 512 512 S360 680 220 850"/>
      <ellipse cx="512" cy="512" rx="365" ry="130" transform="rotate(-18 512 512)" opacity=".55"/>
      <ellipse cx="512" cy="512" rx="355" ry="185" transform="rotate(24 512 512)" opacity=".42"/>
      <ellipse cx="512" cy="512" rx="290" ry="95" transform="rotate(2 512 512)" opacity=".4"/>
    </g>

    <!-- Main luminous energy ribbons -->
    <path d="M175 700 C310 660 365 565 470 520 C590 468 680 330 835 285" fill="none" stroke="#00dfff" stroke-opacity=".24" stroke-width="34" filter="url(#softGlow)"/>
    <path d="M175 700 C310 660 365 565 470 520 C590 468 680 330 835 285" fill="none" stroke="url(#energy)" stroke-width="8" filter="url(#glow)"/>
    <path d="M150 410 C280 490 385 610 510 520 C640 425 725 470 875 585" fill="none" stroke="#35eaff" stroke-opacity=".2" stroke-width="24" filter="url(#softGlow)"/>
    <path d="M150 410 C280 490 385 610 510 520 C640 425 725 470 875 585" fill="none" stroke="url(#energy)" stroke-width="5"/>
    <path d="M210 805 C360 680 420 585 512 512 C625 422 700 270 820 225" fill="none" stroke="#35eaff" stroke-opacity=".7" stroke-width="2.5"/>

    <!-- Radial data filaments -->
    <g stroke="#76efff" stroke-width="2" opacity=".72">
      <path d="M512 512 L512 130"/><path d="M512 512 L610 150"/><path d="M512 512 L735 205"/>
      <path d="M512 512 L870 345"/><path d="M512 512 L905 510"/><path d="M512 512 L820 740"/>
      <path d="M512 512 L675 865"/><path d="M512 512 L500 900"/><path d="M512 512 L330 830"/>
      <path d="M512 512 L170 690"/><path d="M512 512 L115 510"/><path d="M512 512 L205 300"/>
      <path d="M512 512 L350 175"/><path d="M512 512 L420 110"/>
    </g>

    <!-- Small interface-like marks -->
    <g fill="#9af7ff" opacity=".8">
      <rect x="250" y="390" width="7" height="7" rx="1"/><rect x="270" y="390" width="7" height="7" rx="1"/><rect x="290" y="390" width="7" height="7" rx="1"/><rect x="310" y="390" width="7" height="7" rx="1"/>
      <rect x="715" y="620" width="7" height="7" rx="1"/><rect x="735" y="620" width="7" height="7" rx="1"/><rect x="755" y="620" width="7" height="7" rx="1"/><rect x="775" y="620" width="7" height="7" rx="1"/>
      <rect x="320" y="710" width="6" height="6" rx="1"/><rect x="338" y="710" width="6" height="6" rx="1"/><rect x="356" y="710" width="6" height="6" rx="1"/>
      <rect x="650" y="330" width="6" height="6" rx="1"/><rect x="668" y="330" width="6" height="6" rx="1"/><rect x="686" y="330" width="6" height="6" rx="1"/>
    </g>

    <!-- Glowing network nodes -->
    <g fill="#d9ffff" filter="url(#glow)">
      <circle cx="245" cy="290" r="7"/><circle cx="330" cy="350" r="5"/><circle cx="385" cy="405" r="6"/>
      <circle cx="670" cy="220" r="6"/><circle cx="800" cy="300" r="8"/><circle cx="870" cy="455" r="5"/>
      <circle cx="820" cy="720" r="7"/><circle cx="700" cy="800" r="6"/><circle cx="360" cy="810" r="8"/>
      <circle cx="190" cy="650" r="5"/><circle cx="145" cy="500" r="6"/><circle cx="510" cy="145" r="5"/>
      <circle cx="515" cy="880" r="5"/><circle cx="755" cy="565" r="4"/><circle cx="280" cy="555" r="4"/>
    </g>
    <g fill="#24dfff" opacity=".9">
      <circle cx="245" cy="290" r="3"/><circle cx="330" cy="350" r="2.5"/><circle cx="385" cy="405" r="3"/>
      <circle cx="670" cy="220" r="3"/><circle cx="800" cy="300" r="4"/><circle cx="870" cy="455" r="2.5"/>
      <circle cx="820" cy="720" r="3.5"/><circle cx="700" cy="800" r="3"/><circle cx="360" cy="810" r="4"/>
      <circle cx="190" cy="650" r="2.5"/><circle cx="145" cy="500" r="3"/><circle cx="510" cy="145" r="2.5"/>
      <circle cx="515" cy="880" r="2.5"/>
    </g>
  </g>

  <!-- Central intelligence core -->
  <circle cx="512" cy="512" r="100" fill="#1edfff" opacity=".22" filter="url(#softGlow)"/>
  <circle cx="512" cy="512" r="82" fill="url(#core)" stroke="#d9ffff" stroke-width="5"/>
  <circle cx="512" cy="512" r="68" fill="none" stroke="#aafaff" stroke-opacity=".68" stroke-width="2"/>
  <path d="M463 468 C480 430 530 420 562 448 C528 439 495 455 484 485 C477 504 480 526 494 544 C460 525 448 495 463 468Z" fill="url(#shine)" opacity=".8"/>
  <circle cx="512" cy="512" r="13" fill="#ffffff" filter="url(#glow)"/>
  <circle cx="512" cy="512" r="5" fill="#ffffff"/>

  <!-- Glass reflections and rim highlights -->
  <path d="M180 360 C220 190 390 95 565 88" fill="none" stroke="#e8ffff" stroke-width="8" stroke-linecap="round" opacity=".48"/>
  <path d="M145 530 C150 330 260 165 420 115" fill="none" stroke="#b8faff" stroke-width="3" stroke-linecap="round" opacity=".42"/>
  <path d="M650 920 C810 860 925 720 945 565" fill="none" stroke="#d7ffff" stroke-width="7" stroke-linecap="round" opacity=".35"/>
  <circle cx="512" cy="512" r="440" fill="none" stroke="#e8ffff" stroke-opacity=".3" stroke-width="2"/>
</svg>