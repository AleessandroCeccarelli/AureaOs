<?xml version="1.0" encoding="UTF-8"?>
<!-- SPDX-License-Identifier: GPL-3.0-or-later -->
<!-- AureaOS File Manager: square, recognizable folder silhouette; Wallet-matched metallic blue finish; transparent canvas. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" role="img" aria-labelledby="title desc">
<title id="title">AureaOS File Manager</title>
<desc id="desc">A nearly square, front-facing blue folder with a clearly raised upper-left tab, layered silver and cyan metallic bevels, and glossy enamel finish. Transparent background.</desc>
<defs>
 <linearGradient id="silver" x1="88" y1="92" x2="552" y2="550" gradientUnits="userSpaceOnUse">
  <stop stop-color="#faffff"/><stop offset=".13" stop-color="#a8e4ff"/><stop offset=".27" stop-color="#f5ffff"/><stop offset=".47" stop-color="#83b6d9"/><stop offset=".67" stop-color="#e9fbff"/><stop offset=".84" stop-color="#80b8dc"/><stop offset="1" stop-color="#faffff"/>
 </linearGradient>
 <linearGradient id="cyan" x1="70" y1="100" x2="570" y2="535" gradientUnits="userSpaceOnUse">
  <stop stop-color="#eaffff"/><stop offset=".2" stop-color="#13d9ff"/><stop offset=".42" stop-color="#9af8ff"/><stop offset=".68" stop-color="#078fe0"/><stop offset=".86" stop-color="#dfffff"/><stop offset="1" stop-color="#29cfff"/>
 </linearGradient>
 <linearGradient id="enamel" x1="105" y1="160" x2="535" y2="520" gradientUnits="userSpaceOnUse">
  <stop stop-color="#62dcff"/><stop offset=".2" stop-color="#168bd1"/><stop offset=".48" stop-color="#0755a6"/><stop offset=".76" stop-color="#06438d"/><stop offset="1" stop-color="#087ac2"/>
 </linearGradient>
 <linearGradient id="leftFacet" x1="100" y1="190" x2="320" y2="520" gradientUnits="userSpaceOnUse">
  <stop stop-color="#b4f7ff" stop-opacity=".48"/><stop offset=".48" stop-color="#5bcdf5" stop-opacity=".16"/><stop offset="1" stop-color="#00346e" stop-opacity=".1"/>
 </linearGradient>
 <linearGradient id="rightFacet" x1="320" y1="180" x2="550" y2="530" gradientUnits="userSpaceOnUse">
  <stop stop-color="#002d70" stop-opacity=".24"/><stop offset=".52" stop-color="#001e5b" stop-opacity=".08"/><stop offset="1" stop-color="#001943" stop-opacity=".34"/>
 </linearGradient>
 <linearGradient id="tabFace" x1="100" y1="90" x2="330" y2="245" gradientUnits="userSpaceOnUse">
  <stop stop-color="#8cecff"/><stop offset=".32" stop-color="#168bd2"/><stop offset="1" stop-color="#06448e"/>
 </linearGradient>
 <filter id="shadow" x="-25%" y="-25%" width="150%" height="165%">
  <feGaussianBlur in="SourceAlpha" stdDeviation="12" result="b"/><feOffset dy="10" result="o"/>
  <feColorMatrix in="o" type="matrix" values="0 0 0 0 .02 0 0 0 0 .12 0 0 0 0 .26 0 0 0 .42 0" result="s"/>
  <feMerge><feMergeNode in="s"/><feMergeNode in="SourceGraphic"/></feMerge>
 </filter>
 <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
  <feGaussianBlur stdDeviation="9" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
 </filter>
 <filter id="wideGlow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="20"/></filter>
 <clipPath id="folderFace">
  <path d="M112 250 Q112 230 134 230 H518 Q542 230 542 255 V495 Q542 520 517 520 H123 Q98 520 98 495 V265 Q98 250 112 250Z"/>
 </clipPath>
</defs>

<!-- Soft cyan rim light; transparent beyond the folder silhouette -->
<path d="M78 218 Q78 178 119 178 H246 Q269 178 289 198 L331 240 H520 Q570 240 570 290 V500 Q570 552 518 552 H122 Q70 552 70 500 V226Z"
      fill="#17dfff" opacity=".2" filter="url(#wideGlow)"/>

<g filter="url(#shadow)">
 <!-- One clear folder silhouette with a prominent raised tab -->
 <path d="M78 218 Q78 178 119 178 H246 Q269 178 289 198 L331 240 H520 Q570 240 570 290 V500 Q570 552 518 552 H122 Q70 552 70 500 V226 Q70 218 78 218Z"
       fill="url(#silver)" stroke="#faffff" stroke-width="5" stroke-linejoin="round"/>
 <!-- Cyan metallic bevel -->
 <path d="M91 224 Q91 191 122 191 H242 Q263 191 280 208 L326 253 H516 Q556 253 556 293 V496 Q556 538 516 538 H124 Q84 538 84 498 V229Z"
       fill="#07539b" stroke="url(#cyan)" stroke-width="8" stroke-linejoin="round"/>
 <!-- Tab's blue enamel plane, clearly visible above the front panel -->
 <path d="M103 225 Q103 204 125 204 H239 Q257 204 272 219 L308 254 H103Z"
       fill="url(#tabFace)" stroke="#bff8ff" stroke-opacity=".75" stroke-width="3" stroke-linejoin="round"/>
 <path d="M111 219 Q111 211 126 211 H238 Q254 211 267 225 L290 247"
       fill="none" stroke="#ffffff" stroke-opacity=".78" stroke-width="5" stroke-linecap="round"/>
 <!-- Front panel's silver lip -->
 <path d="M99 270 Q99 251 120 251 H520 Q548 251 548 279 V496 Q548 529 515 529 H125 Q92 529 92 496 V278Z"
       fill="url(#silver)" stroke="#faffff" stroke-width="5" stroke-linejoin="round"/>
 <!-- Front cyan bevel -->
 <path d="M110 279 Q110 264 126 264 H514 Q535 264 535 285 V492 Q535 516 512 516 H128 Q105 516 105 492 V284Z"
       fill="#064b91" stroke="url(#cyan)" stroke-width="8" stroke-linejoin="round"/>
 <!-- Main blue face -->
 <path d="M123 292 Q123 278 138 278 H502 Q522 278 522 298 V486 Q522 503 505 503 H135 Q118 503 118 486 V297Z"
       fill="url(#enamel)" stroke="url(#silver)" stroke-width="3" stroke-linejoin="round"/>
 <g clip-path="url(#folderFace)">
  <path d="M110 270 H320 V530 H110Z" fill="url(#leftFacet)"/>
  <path d="M320 250 H555 V535 H320Z" fill="url(#rightFacet)"/>
  <path d="M320 278 V505" stroke="#d9ffff" stroke-opacity=".14" stroke-width="2"/>
  <path d="M127 291 Q315 307 513 291" fill="none" stroke="#eaffff" stroke-opacity=".4" stroke-width="5"/>
  <path d="M128 485 Q315 500 512 485" fill="none" stroke="#8ceeff" stroke-opacity=".24" stroke-width="4"/>
 </g>
 <!-- Fine polished highlight on the front edge -->
 <path d="M127 282 H500 Q519 282 522 300" fill="none" stroke="#f1ffff" stroke-opacity=".82" stroke-width="5" stroke-linecap="round"/>
</g>
</svg>