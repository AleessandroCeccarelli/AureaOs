<!-- Faithful vector interpretation of the approved AureaOS flowing ribbon-A concept. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
<title id="title">AureaOS launcher symbol</title><desc id="desc">A luminous blue and cyan dimensional ribbon forms an open flowing letter A, with a curved foreground ribbon weaving across its legs. Transparent background.</desc>
<defs>
<linearGradient id="arch" x1=".15" y1="0" x2=".85" y2="1"><stop stop-color="#42DCFF"/><stop offset=".25" stop-color="#087FEA"/><stop offset=".56" stop-color="#0758CE"/><stop offset=".82" stop-color="#0878DF"/><stop offset="1" stop-color="#59E5FF"/></linearGradient>
<linearGradient id="cross" x1="0" y1="0" x2="1" y2=".8"><stop stop-color="#B8F8FF"/><stop offset=".22" stop-color="#43D9FA"/><stop offset=".62" stop-color="#12A9EF"/><stop offset=".84" stop-color="#1688E8"/><stop offset="1" stop-color="#C0FAFF"/></linearGradient>
<linearGradient id="shine" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#FFF" stop-opacity=".08"/><stop offset=".3" stop-color="#E7FDFF" stop-opacity=".75"/><stop offset=".55" stop-color="#FFF" stop-opacity=".12"/><stop offset=".85" stop-color="#C8F8FF" stop-opacity=".55"/><stop offset="1" stop-color="#FFF" stop-opacity=".08"/></linearGradient>
<linearGradient id="cross-shine" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#FFF" stop-opacity=".8"/><stop offset=".45" stop-color="#E8FFFF" stop-opacity=".25"/><stop offset="1" stop-color="#FFF" stop-opacity=".02"/></linearGradient>
<filter id="ribbon-shadow" x="-.35" y="-.35" width="1.8" height="1.9"><feGaussianBlur in="SourceAlpha" stdDeviation="17"/><feOffset dy="22"/><feComponentTransfer><feFuncA type="linear" slope=".32"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="soft-glow" x="-.5" y="-.5" width="2" height="2"><feGaussianBlur stdDeviation="15"/></filter></defs><g filter="url(#ribbon-shadow)" fill="none" stroke-linecap="round" stroke-linejoin="round">
<path d="M252 770 C306 655 405 421 491 269 C513 230 542 210 565 238 C657 386 744 628 803 770" stroke="#064BAF" stroke-opacity=".3" stroke-width="146"/><path d="M252 770 C306 655 405 421 491 269 C513 230 542 210 565 238 C657 386 744 628 803 770" stroke="url(#arch)" stroke-width="116"/><path d="M252 770 C306 655 405 421 491 269 C513 230 542 210 565 238 C657 386 744 628 803 770" stroke="url(#shine)" stroke-width="13" stroke-dasharray="260 1100" stroke-dashoffset="-38"/></g>
