<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
<title id="title">AureaOS light Trash — Empty</title>
<desc id="desc">Open, lidless desktop waste bin in the AureaOS style, empty state, with a transparent background.</desc>
<defs>
 <linearGradient id="binBody" x1="150" y1="190" x2="365" y2="435" gradientUnits="userSpaceOnUse"><stop stop-color="#EAF3F8"/><stop offset="1" stop-color="#9FB8C8"/></linearGradient>
 <linearGradient id="inner" x1="180" y1="160" x2="330" y2="250" gradientUnits="userSpaceOnUse"><stop stop-color="#506D80"/><stop offset="1" stop-color="#526D80"/></linearGradient>
 <linearGradient id="rim" x1="145" y1="170" x2="370" y2="205" gradientUnits="userSpaceOnUse"><stop stop-color="#EAF3F8"/><stop offset="1" stop-color="#9FB8C8"/></linearGradient>
 <filter id="shadow" x="-30%" y="-25%" width="160%" height="175%"><feGaussianBlur in="SourceAlpha" stdDeviation="8"/><feOffset dy="9"/><feComponentTransfer><feFuncA type="linear" slope=".23"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <clipPath id="opening"><ellipse cx="256" cy="184" rx="104" ry="29"/></clipPath>
</defs>
<g filter="url(#shadow)">
 <!-- Rear wall and dark, open interior -->
 <path d="M151 184Q151 155 178 155H334Q361 155 361 184L341 402Q338 431 309 431H203Q174 431 171 402Z" fill="url(#binBody)" stroke="#526D80" stroke-width="8" stroke-linejoin="round"/>
 <ellipse cx="256" cy="184" rx="104" ry="29" fill="url(#inner)" stroke="#526D80" stroke-width="7"/>
 <!-- Paper is visible inside the opening; on the full state it rises above the rim -->
 <g></g>
 <!-- Front body wall, leaving the opening visibly uncovered -->
 <path d="M152 185Q256 224 360 185L341 402Q338 431 309 431H203Q174 431 171 402Z" fill="url(#binBody)" stroke="#526D80" stroke-width="8" stroke-linejoin="round"/>
 <path d="M174 207Q256 237 338 207" fill="none" stroke="#FFFFFF" stroke-opacity=".52" stroke-width="6" stroke-linecap="round"/>
 <path d="M190 236L204 399" stroke="#FFFFFF" stroke-opacity=".62" stroke-width="8" stroke-linecap="round"/>
 <path d="M322 238L307 402" stroke="#526D80" stroke-opacity=".38" stroke-width="7" stroke-linecap="round"/>
 <path d="M222 252L214 390M256 259V394M290 252L298 390" stroke="#526D80" stroke-opacity=".38" stroke-width="10" stroke-linecap="round"/>
 <!-- Front lip: a simple open rim, never a lid -->
 <path d="M145 184Q145 168 162 168H350Q367 168 367 184Q367 201 350 207Q256 237 162 207Q145 201 145 184Z" fill="url(#rim)" stroke="#526D80" stroke-width="7"/>
 <path d="M160 180Q256 211 352 180" fill="none" stroke="#FFFFFF" stroke-opacity=".78" stroke-width="6" stroke-linecap="round"/>
</g>
</svg>