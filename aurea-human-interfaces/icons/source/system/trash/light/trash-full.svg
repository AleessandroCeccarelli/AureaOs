<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
<title id="title">AureaOS light translucent Trash — full</title>
<desc id="desc">Open frosted translucent white wastebasket with a gently tapered rounded body and softly visible contents. Transparent background.</desc>
<defs>
 <linearGradient id="body" x1="112" y1="150" x2="404" y2="425" gradientUnits="userSpaceOnUse">
  <stop stop-color="#FFFFFF" stop-opacity=".94"/><stop offset=".24" stop-color="#FFFFFF" stop-opacity=".73"/><stop offset=".62" stop-color="#E7E9EF" stop-opacity=".62"/><stop offset=".88" stop-color="#FFFFFF" stop-opacity=".78"/><stop offset="1" stop-color="#FFFFFF" stop-opacity=".96"/>
 </linearGradient>
 <linearGradient id="side" x1="112" y1="0" x2="404" y2="0" gradientUnits="userSpaceOnUse">
  <stop stop-color="#FFFFFF" stop-opacity=".72"/><stop offset=".2" stop-color="#FFFFFF" stop-opacity=".08"/><stop offset=".52" stop-color="#FFFFFF" stop-opacity=".02"/><stop offset=".82" stop-color="#FFFFFF" stop-opacity=".14"/><stop offset="1" stop-color="#FFFFFF" stop-opacity=".7"/>
 </linearGradient>
 <linearGradient id="inside" x1="160" y1="105" x2="350" y2="175">
  <stop stop-color="#AAA2B1" stop-opacity=".5"/><stop offset="1" stop-color="#C8C0CD" stop-opacity=".28"/>
 </linearGradient>
 <linearGradient id="rim" x1="120" y1="120" x2="390" y2="155">
  <stop stop-color="#FFFFFF"/><stop offset=".48" stop-color="#E7E9EF" stop-opacity=".92"/><stop offset=".76" stop-color="#FFFFFF"/><stop offset="1" stop-color="#7B8192" stop-opacity=".4"/>
 </linearGradient>
 <linearGradient id="base" x1="130" y1="410" x2="380" y2="450">
  <stop stop-color="#FFFFFF" stop-opacity=".9"/><stop offset=".5" stop-color="#E7E9EF" stop-opacity=".76"/><stop offset="1" stop-color="#FFFFFF" stop-opacity=".96"/>
 </linearGradient>
 <filter id="blur" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="5"/></filter>
 <clipPath id="insideBody"><path d="M120 137C120 116 181 101 256 101S392 116 392 137L369 402C367 432 323 449 256 449S145 432 143 402Z"/></clipPath>
</defs>
<ellipse cx="256" cy="452" rx="120" ry="12" fill="#7B8192" opacity=".16" filter="url(#blur)"/>
<!-- Rear wall and open cavity -->
<path d="M120 137C120 116 181 101 256 101S392 116 392 137L369 402C367 432 323 449 256 449S145 432 143 402Z" fill="url(#body)" opacity=".45"/>
<ellipse cx="256" cy="137" rx="136" ry="34" fill="url(#inside)"/>
<!-- Discarded contents: placed behind the translucent front wall; upper pieces remain above the rim. -->

 <g opacity="1">
  <!-- A visibly overfilled pile: folded sheets, crumpled paper and colored packaging rise well above the rim. -->
  <path d="M137 137L145 84Q148 70 162 75L204 94L218 145L180 163Z" fill="#F7F4ED" stroke="#BEBAB2" stroke-width="3"/>
  <path d="M151 89L176 112L205 100M160 129L183 116L204 137" fill="none" stroke="#C7C2B9" stroke-width="4" stroke-linecap="round"/>
  <path d="M176 144L192 64Q195 50 211 55L255 80L250 151L210 169Z" fill="#FFFDF8" stroke="#C4C0B9" stroke-width="3"/>
  <path d="M201 65L221 96L250 79M202 126L224 110L247 132" fill="none" stroke="#C7C3BC" stroke-width="4" stroke-linecap="round"/>
  <path d="M226 144L249 67Q254 51 269 59L310 87L293 158L255 170Z" fill="#F9F7F1" stroke="#C2BEB7" stroke-width="3"/>
  <path d="M258 67L270 105L301 91M252 132L277 113L294 140" fill="none" stroke="#C9C4BC" stroke-width="4" stroke-linecap="round"/>
  <path d="M285 147L309 77Q314 62 329 70L371 100L347 164L309 171Z" fill="#8FB5D1" stroke="#6E8DA8" stroke-width="3"/>
  <path d="M318 78L334 112L363 101M309 143L336 122L352 145" fill="none" stroke="#6D8EAA" stroke-width="4" stroke-linecap="round"/>
  <path d="M344 149L370 94Q377 81 390 91L420 119L390 166L357 171Z" fill="#E8CB8D" stroke="#B69B65" stroke-width="3"/>
  <path d="M378 98L390 127L412 120M367 146L391 132" fill="none" stroke="#B69B65" stroke-width="4" stroke-linecap="round"/>
  <path d="M159 154L170 119L197 110L217 132L201 166L173 173Z" fill="#D9DDE4" stroke="#AEB5C0" stroke-width="3"/>
  <path d="M175 127L191 145L209 132" fill="none" stroke="#AAB2BE" stroke-width="4" stroke-linecap="round"/>
  <path d="M244 155L263 117L287 112L307 136L289 169L258 177Z" fill="#FDFCF8" stroke="#C6C2BB" stroke-width="3"/>
  <path d="M267 124L281 145L302 133" fill="none" stroke="#C7C3BC" stroke-width="4" stroke-linecap="round"/>
 </g>
<!-- Softly diffused contents visible through the body -->
<g clip-path="url(#insideBody)" opacity=".24" filter="url(#blur)">
 <ellipse cx="205" cy="277" rx="35" ry="49" fill="#E6C9A4"/>
 <ellipse cx="296" cy="305" rx="48" ry="56" fill="#9DB8C9"/>
 <ellipse cx="250" cy="360" rx="72" ry="32" fill="#D8D1C9"/>
</g>
<!-- Translucent front shell -->
<path d="M120 137C120 116 181 101 256 101S392 116 392 137L369 402C367 432 323 449 256 449S145 432 143 402Z" fill="url(#body)" opacity=".42"/>
<path d="M120 137C120 116 181 101 256 101S392 116 392 137L369 402C367 432 323 449 256 449S145 432 143 402Z" fill="url(#side)" opacity=".56"/>
<path d="M137 154C143 260 149 354 160 410M375 154C369 260 363 354 352 410" fill="none" stroke="#FFFFFF" stroke-opacity=".58" stroke-width="5" stroke-linecap="round"/>
<!-- Rounded lower reinforcement -->
<path d="M143 400C145 432 190 449 256 449S367 432 369 400" fill="none" stroke="url(#base)" stroke-width="9"/>
<!-- Rolled open rim -->
<ellipse cx="256" cy="137" rx="136" ry="34" fill="none" stroke="#FFFFFF" stroke-opacity=".96" stroke-width="4"/>
<ellipse cx="256" cy="135" rx="136" ry="34" fill="none" stroke="url(#rim)" stroke-width="5"/>
<path d="M126 140C151 158 207 171 256 171S361 158 386 140" fill="none" stroke="#7B8192" stroke-opacity=".16" stroke-width="2"/>
</svg>