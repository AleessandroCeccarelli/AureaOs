<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
<title id="title">AureaOS dark translucent Trash — full</title>
<desc id="desc">Open frosted translucent white wastebasket with a gently tapered rounded body and softly visible contents. Transparent background.</desc>
<defs>
 <linearGradient id="body" x1="112" y1="150" x2="404" y2="425" gradientUnits="userSpaceOnUse">
  <stop stop-color="#F7F9FD" stop-opacity=".94"/><stop offset=".24" stop-color="#E9EEF7" stop-opacity=".73"/><stop offset=".62" stop-color="#C3CDDD" stop-opacity=".62"/><stop offset=".88" stop-color="#E9EEF7" stop-opacity=".78"/><stop offset="1" stop-color="#F7F9FD" stop-opacity=".96"/>
 </linearGradient>
 <linearGradient id="side" x1="112" y1="0" x2="404" y2="0" gradientUnits="userSpaceOnUse">
  <stop stop-color="#F7F9FD" stop-opacity=".72"/><stop offset=".2" stop-color="#E9EEF7" stop-opacity=".08"/><stop offset=".52" stop-color="#E9EEF7" stop-opacity=".02"/><stop offset=".82" stop-color="#E9EEF7" stop-opacity=".14"/><stop offset="1" stop-color="#F7F9FD" stop-opacity=".7"/>
 </linearGradient>
 <linearGradient id="inside" x1="160" y1="105" x2="350" y2="175">
  <stop stop-color="#68748A" stop-opacity=".5"/><stop offset="1" stop-color="#3D485B" stop-opacity=".28"/>
 </linearGradient>
 <linearGradient id="rim" x1="120" y1="120" x2="390" y2="155">
  <stop stop-color="#F7F9FD"/><stop offset=".48" stop-color="#C3CDDD" stop-opacity=".92"/><stop offset=".76" stop-color="#F7F9FD"/><stop offset="1" stop-color="#6C7890" stop-opacity=".4"/>
 </linearGradient>
 <linearGradient id="base" x1="130" y1="410" x2="380" y2="450">
  <stop stop-color="#E9EEF7" stop-opacity=".9"/><stop offset=".5" stop-color="#C3CDDD" stop-opacity=".76"/><stop offset="1" stop-color="#F7F9FD" stop-opacity=".96"/>
 </linearGradient>
 <filter id="blur" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="5"/></filter>
 <clipPath id="insideBody"><path d="M120 137C120 116 181 101 256 101S392 116 392 137L369 402C367 432 323 449 256 449S145 432 143 402Z"/></clipPath>
</defs>
<ellipse cx="256" cy="452" rx="120" ry="12" fill="#6C7890" opacity=".16" filter="url(#blur)"/>
<!-- Rear wall and open cavity -->
<path d="M120 137C120 116 181 101 256 101S392 116 392 137L369 402C367 432 323 449 256 449S145 432 143 402Z" fill="url(#body)" opacity=".45"/>
<ellipse cx="256" cy="137" rx="136" ry="34" fill="url(#inside)"/>
<!-- Discarded contents: placed behind the translucent front wall; upper pieces remain above the rim. -->

 <g opacity="1">
  <path d="M165 144l10-47 34-16 37 22-12 52-39 9z" fill="#FBF9F3" stroke="#C5C4C4" stroke-width="2.5"/>
  <path d="M178 104l29 17 28-13M181 137l29-8" fill="none" stroke="#C4C2BE" stroke-width="3" stroke-linecap="round"/>
  <path d="M225 140l22-49 34-8 32 23-20 48-42 9z" fill="#FDFCF8" stroke="#C5C4C4" stroke-width="2.5"/>
  <path d="M250 100l27 17 28-9M251 132l29-9" fill="none" stroke="#C7C5C1" stroke-width="3" stroke-linecap="round"/>
  <path d="M292 141l18-44 32-6 28 27-22 42-37 4z" fill="#91B5D0" stroke="#718EA8" stroke-width="2.5"/>
  <path d="M313 106l23 14 27-8" fill="none" stroke="#6F8DA9" stroke-width="3"/>
  <path d="M351 148l19-36 27-3 18 25-20 31-30 2z" fill="#E7CC91" stroke="#B9A16F" stroke-width="2.5"/>
 </g>
<!-- Softly diffused contents visible through the body -->
<g clip-path="url(#insideBody)" opacity=".24" filter="url(#blur)">
 <ellipse cx="205" cy="277" rx="35" ry="49" fill="#E6C9A4"/>
 <ellipse cx="296" cy="305" rx="48" ry="56" fill="#9DB8C9"/>
 <ellipse cx="250" cy="360" rx="72" ry="32" fill="#D8D1C9"/>
</g>
<!-- Translucent front shell -->
<path d="M120 137C120 116 181 101 256 101S392 116 392 137L369 402C367 432 323 449 256 449S145 432 143 402Z" fill="url(#body)" opacity=".42"/>
<path d="M120 137C120 116 181 101 256 101S392 116 392 137L369 402C367 432 323 449 256 449S145 432 143 402Z" fill="url(#side)" opacity=".56"/>
<path d="M137 154C143 260 149 354 160 410M375 154C369 260 363 354 352 410" fill="none" stroke="#F7F9FD" stroke-opacity=".58" stroke-width="5" stroke-linecap="round"/>
<!-- Rounded lower reinforcement -->
<path d="M143 400C145 432 190 449 256 449S367 432 369 400" fill="none" stroke="url(#base)" stroke-width="9"/>
<!-- Rolled open rim -->
<ellipse cx="256" cy="137" rx="136" ry="34" fill="none" stroke="#F7F9FD" stroke-opacity=".96" stroke-width="4"/>
<ellipse cx="256" cy="135" rx="136" ry="34" fill="none" stroke="url(#rim)" stroke-width="5"/>
<path d="M126 140C151 158 207 171 256 171S361 158 386 140" fill="none" stroke="#6C7890" stroke-opacity=".16" stroke-width="2"/>
</svg>