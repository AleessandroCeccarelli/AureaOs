<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
<title id="title">AureaOS dark Trash — Partially full</title>
<desc id="desc">Open, lidless desktop waste bin in the AureaOS style, partially full state, with a transparent background.</desc>
<defs>
 <linearGradient id="binBody" x1="150" y1="190" x2="365" y2="435" gradientUnits="userSpaceOnUse"><stop stop-color="#C8DCE8"/><stop offset="1" stop-color="#718FA3"/></linearGradient>
 <linearGradient id="inner" x1="180" y1="160" x2="330" y2="250" gradientUnits="userSpaceOnUse"><stop stop-color="#344F63"/><stop offset="1" stop-color="#405C70"/></linearGradient>
 <linearGradient id="rim" x1="145" y1="170" x2="370" y2="205" gradientUnits="userSpaceOnUse"><stop stop-color="#C8DCE8"/><stop offset="1" stop-color="#718FA3"/></linearGradient>
 <filter id="shadow" x="-30%" y="-25%" width="160%" height="175%"><feGaussianBlur in="SourceAlpha" stdDeviation="8"/><feOffset dy="9"/><feComponentTransfer><feFuncA type="linear" slope=".23"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <clipPath id="opening"><ellipse cx="256" cy="184" rx="104" ry="29"/></clipPath>
</defs>
<g filter="url(#shadow)">
 <!-- Rear wall and dark, open interior -->
 <path d="M151 184Q151 155 178 155H334Q361 155 361 184L341 402Q338 431 309 431H203Q174 431 171 402Z" fill="url(#binBody)" stroke="#405C70" stroke-width="8" stroke-linejoin="round"/>
 <ellipse cx="256" cy="184" rx="104" ry="29" fill="url(#inner)" stroke="#405C70" stroke-width="7"/>
 <!-- Paper is visible inside the opening; on the full state it rises above the rim -->
 <g>
  <path d="M194 179L205 137Q208 127 219 132L248 145L242 185Z" fill="#F1EBDD" stroke="#BFB5A5" stroke-width="5" stroke-linejoin="round"/>
  <path d="M215 140L229 160L244 146" fill="none" stroke="#BFB5A5" stroke-width="5" stroke-linecap="round"/>
  <path d="M253 177L268 132Q272 122 283 128L315 146L302 187Z" fill="#FFFFFF" stroke="#BFB5A5" stroke-width="5" stroke-linejoin="round"/>
  <path d="M273 134L287 155L310 147" fill="none" stroke="#BFB5A5" stroke-width="5" stroke-linecap="round"/>
  <path d="M303 187L326 158Q333 150 342 158L358 176L342 202Z" fill="#58A9E2" stroke="#286D9F" stroke-width="5" stroke-linejoin="round"/></g>
 <!-- Front body wall, leaving the opening visibly uncovered -->
 <path d="M152 185Q256 224 360 185L341 402Q338 431 309 431H203Q174 431 171 402Z" fill="url(#binBody)" stroke="#405C70" stroke-width="8" stroke-linejoin="round"/>
 <path d="M174 207Q256 237 338 207" fill="none" stroke="#F5FBFF" stroke-opacity=".52" stroke-width="6" stroke-linecap="round"/>
 <path d="M190 236L204 399" stroke="#F5FBFF" stroke-opacity=".62" stroke-width="8" stroke-linecap="round"/>
 <path d="M322 238L307 402" stroke="#405C70" stroke-opacity=".38" stroke-width="7" stroke-linecap="round"/>
 <path d="M222 252L214 390M256 259V394M290 252L298 390" stroke="#405C70" stroke-opacity=".38" stroke-width="10" stroke-linecap="round"/>
 <!-- Front lip: a simple open rim, never a lid -->
 <path d="M145 184Q145 168 162 168H350Q367 168 367 184Q367 201 350 207Q256 237 162 207Q145 201 145 184Z" fill="url(#rim)" stroke="#405C70" stroke-width="7"/>
 <path d="M160 180Q256 211 352 180" fill="none" stroke="#F5FBFF" stroke-opacity=".78" stroke-width="6" stroke-linecap="round"/>
</g>
</svg>