<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
<title id="title">AureaOS dark translucent Trash — empty</title>
<desc id="desc">Open, softly frosted translucent white wastebasket with a gently tapered rounded body. Contents are softly visible through its sides. Transparent background.</desc>
<defs>
 <linearGradient id="body" x1="112" y1="150" x2="404" y2="425" gradientUnits="userSpaceOnUse">
  <stop stop-color="#F2F5FB" stop-opacity=".9"/><stop offset=".22" stop-color="#D8E0EE" stop-opacity=".76"/><stop offset=".62" stop-color="#AEBBD0" stop-opacity=".68"/><stop offset=".88" stop-color="#D8E0EE" stop-opacity=".82"/><stop offset="1" stop-color="#F2F5FB" stop-opacity=".96"/>
 </linearGradient>
 <linearGradient id="side" x1="112" y1="0" x2="404" y2="0" gradientUnits="userSpaceOnUse">
  <stop stop-color="#FFFFFF" stop-opacity=".72"/><stop offset=".18" stop-color="#D8E0EE" stop-opacity=".12"/><stop offset=".52" stop-color="#D8E0EE" stop-opacity=".04"/><stop offset=".84" stop-color="#D8E0EE" stop-opacity=".18"/><stop offset="1" stop-color="#F2F5FB" stop-opacity=".74"/>
 </linearGradient>
 <linearGradient id="inner" x1="170" y1="105" x2="350" y2="175">
  <stop stop-color="#657086" stop-opacity=".42"/><stop offset="1" stop-color="#39465B" stop-opacity=".28"/>
 </linearGradient>
 <linearGradient id="rim" x1="120" y1="120" x2="390" y2="155">
  <stop stop-color="#F2F5FB" stop-opacity=".98"/><stop offset=".45" stop-color="#AEBBD0" stop-opacity=".9"/><stop offset=".72" stop-color="#F2F5FB" stop-opacity=".98"/><stop offset="1" stop-color="#526078" stop-opacity=".34"/>
 </linearGradient>
 <linearGradient id="base" x1="130" y1="410" x2="380" y2="450">
  <stop stop-color="#D8E0EE" stop-opacity=".88"/><stop offset=".5" stop-color="#AEBBD0" stop-opacity=".72"/><stop offset="1" stop-color="#F2F5FB" stop-opacity=".96"/>
 </linearGradient>
 <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3.2"/></filter>
 <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%"><feGaussianBlur stdDeviation="9"/></filter>
 <clipPath id="cup"><path d="M120 137C120 116 181 101 256 101S392 116 392 137L369 402C367 432 323 449 256 449S145 432 143 402Z"/></clipPath>
</defs>
<ellipse cx="256" cy="451" rx="119" ry="12" fill="#526078" opacity=".18" filter="url(#shadow)"/>
<!-- rear translucent wall and the softly visible interior -->
<path d="M120 137C120 116 181 101 256 101S392 116 392 137L369 402C367 432 323 449 256 449S145 432 143 402Z" fill="url(#body)" opacity=".54"/>
<ellipse cx="256" cy="137" rx="136" ry="34" fill="url(#inner)"/>
<!-- Objects remain softly diffused by the frosted material. -->
<g clip-path="url(#cup)">
 
 <g filter="url(#soft)" opacity="0">
  <ellipse cx="205" cy="277" rx="35" ry="49" fill="#E6C9A4"/>
  <ellipse cx="296" cy="305" rx="48" ry="56" fill="#9DB8C9"/>
  <ellipse cx="250" cy="360" rx="72" ry="32" fill="#D8D1C9"/>
 </g>
 <!-- Frosted front wall: opaque enough to soften, translucent enough to read contents. -->
 <path d="M120 137C120 116 181 101 256 101S392 116 392 137L369 402C367 432 323 449 256 449S145 432 143 402Z" fill="url(#body)" opacity=".68"/>
 <path d="M120 137C120 116 181 101 256 101S392 116 392 137L369 402C367 432 323 449 256 449S145 432 143 402Z" fill="url(#side)" opacity=".66"/>
 <path d="M137 154C143 260 149 354 160 410M375 154C369 260 363 354 352 410" fill="none" stroke="#F2F5FB" stroke-opacity=".62" stroke-width="5" stroke-linecap="round"/>
</g>
<!-- Soft rolled lip, with the open cavity left visible -->
<ellipse cx="256" cy="137" rx="136" ry="34" fill="none" stroke="#F2F5FB" stroke-opacity=".95" stroke-width="3"/>
<ellipse cx="256" cy="135" rx="136" ry="34" fill="none" stroke="url(#rim)" stroke-width="5"/>
<path d="M126 140C151 158 207 171 256 171S361 158 386 140" fill="none" stroke="#526078" stroke-opacity=".18" stroke-width="2"/>
<!-- Rounded lower edge -->
<path d="M143 400C145 432 190 449 256 449S367 432 369 400" fill="none" stroke="url(#base)" stroke-width="8"/>
</svg>